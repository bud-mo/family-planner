server:
  host: 0.0.0.0
  port: 8080
  # Basic Auth opzionale per le rotte /config e /api/config/*.
  # Raccomandato se il server è esposto in LAN senza altre protezioni.
  # auth_username: null
  # auth_password: null
timezone: "Europe/Rome"
display:
  # The e-ink panel is the only supported output. The canvas resolution is
  # derived automatically from eink_model + rotation (see EINK_RESOLUTIONS).
  layout: landscape
  show_buttons: false
  eink_model: 7in5_V2
  eink_palette: bw
  eink_dither: false
  # Saturation passed to the Inky library for photo/artwork rendering (0..1).
  # The library blends its desaturated/saturated hardware palettes by this
  # amount; the official Spectra 6 example uses 0.5. Values >1 are out of range
  # and distort/darken colours.
  eink_saturation: 0.5
  rotation: 0
refresh:
  # Griglia dei repaint del pannello, allineata alla mezzanotte. Il default di
  # 120 min coincide con la finestra di previsione bioraria del meteo: il
  # pannello si ridipinge quando il contenuto cambia davvero, non a vuoto.
  # Deve essere un divisore di 1440.
  display_interval_minutes: 120
  # Solo fetch di rete del calendario, non repaint: una modifica provoca un push
  # dedicato, un calendario invariato non ne provoca nessuno. Divisore di 60.
  calendar_poll_minutes: 15
  # Distanza minima fra due push consecutivi guidati dal calendario: fonde in un
  # solo repaint le raffiche di modifiche fatte dal telefono.
  min_push_interval_minutes: 20
  quiet_hours:
    # Fascia notturna senza repaint: l'e-ink mantiene l'immagine a costo zero e
    # non lampeggia. `start` incluso, `end` escluso; può attraversare la mezzanotte.
    enabled: true
    start: "23:00"
    end: "06:00"
    # Orari a cui il pannello si ridipinge comunque durante la notte. "00:00"
    # serve al cambio di data; "23:00" stampa il frame che sigilla la notte
    # (rimuoverlo fa restare a schermo quello delle 22:00, con un repaint in meno
    # al giorno). Non devono cadere dentro start/end: valgono al proprio orario,
    # così spostare l'inizio della fascia non fa sparire il sigillo. Valgono però
    # solo a fascia attiva.
    # Nei frame notturni la banda meteo perde i dati istantanei (temperatura,
    # icona, min/max): resterebbero a schermo per ore, invecchiando.
    allowed_ticks: ["23:00", "00:00"]
weather:
  enabled: false
  latitude: 45.4654    # Milano — sostituire con le proprie coordinate
  longitude: 9.1866
  units: celsius       # celsius | fahrenheit
artwork:
  query: "landscape painting"
  # "endpoint" → random painting from the online ARTIC API (using `query`).
  # "folder"   → local images from `folder`, alphabetical, next one per button press.
  source: "endpoint"
  folder: "pictures"
  # Minutes between automatic image changes when slideshow mode is active
  # (button C while in artwork mode toggles it). Integer minutes, >= 1.
  slideshow_interval_minutes: 30
calendars: []
