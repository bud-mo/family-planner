server:
  host: 0.0.0.0
  port: 8080
  # Basic Auth opzionale per le rotte /config e /api/config/*.
  # Raccomandato se il server è esposto in LAN senza altre protezioni.
  # auth_username: null
  # auth_password: null
timezone: "Europe/Rome"
display:
  # The e-ink panel is the only supported output. The canvas resolution is
  # derived automatically from eink_model + rotation (see EINK_RESOLUTIONS).
  layout: landscape
  show_buttons: false
  eink_model: 7in5_V2
  eink_palette: bw
  eink_dither: false
  # Saturation passed to the Inky library for photo/artwork rendering (0..1).
  # The library blends its desaturated/saturated hardware palettes by this
  # amount; the official Spectra 6 example uses 0.5. Values >1 are out of range
  # and distort/darken colours.
  eink_saturation: 0.5
  rotation: 0
weather:
  enabled: false
  latitude: 45.4654    # Milano — sostituire con le proprie coordinate
  longitude: 9.1866
  units: celsius       # celsius | fahrenheit
artwork:
  query: "landscape painting"
  # "endpoint" → random painting from the online ARTIC API (using `query`).
  # "folder"   → local images from `folder`, alphabetical, next one per button press.
  source: "endpoint"
  folder: "pictures"
  # Minutes between automatic image changes when slideshow mode is active
  # (button C while in artwork mode toggles it). Integer minutes, >= 1.
  slideshow_interval_minutes: 30
calendars: []
