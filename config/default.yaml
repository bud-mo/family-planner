server:
  host: 0.0.0.0
  port: 8080
  # Basic Auth opzionale per le rotte /config e /api/config/*.
  # Raccomandato se il server è esposto in LAN senza altre protezioni.
  # auth_username: null
  # auth_password: null
timezone: "Europe/Rome"
display:
  fullscreen: false
  type: hdmi
  layout: landscape
  width: 1920
  height: 1080
  show_buttons: false
  eink_model: 7in5_V2
  eink_palette: bw
  eink_dither: false
  eink_gamma: 0.50       # default
  eink_saturation: 1.45  # default
  eink_brightness: 1.15  # default
  rotation: 0
weather:
  enabled: false
  latitude: 45.4654    # Milano — sostituire con le proprie coordinate
  longitude: 9.1866
  units: celsius       # celsius | fahrenheit
artwork:
  query: "landscape painting"
calendars: []
