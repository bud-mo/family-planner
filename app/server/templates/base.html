<!DOCTYPE html>
<html lang="it" data-theme="day">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Family Planner{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ------------------------------------------------------------------ */
    /* Design tokens                                                        */
    /* ------------------------------------------------------------------ */
    :root {
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body:    'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      --font-mono:    'IBM Plex Mono', 'Courier New', monospace;

      --text-xs:   11px;
      --text-sm:   13px;
      --text-base: 15px;
      --text-md:   18px;
      --text-lg:   24px;
      --text-xl:   32px;
      --text-2xl:  48px;

      --header-height: 56px;
      --footer-height: 40px;

      /* Day palette */
      --color-bg:          #F8F6F0;
      --color-bg-alt:      #EEECE6;
      --color-ink:         #111111;
      --color-ink-muted:   #666666;
      --color-ink-faint:   #AAAAAA;
      --color-accent:      #1A1A1A;
      --color-holiday:     #444444;
      --color-rule:        #CCCCAA;
      --color-rule-strong: #333333;
    }

    [data-theme="night"] {
      --color-bg:          #0D0D0D;
      --color-bg-alt:      #1A1A1A;
      --color-ink:         #E8E6E0;
      --color-ink-muted:   #888888;
      --color-ink-faint:   #444444;
      --color-accent:      #E8E6E0;
      --color-holiday:     #AAAAAA;
      --color-rule:        #2A2A2A;
      --color-rule-strong: #CCCCAA;
    }

    /* ------------------------------------------------------------------ */
    /* Reset + base                                                         */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0;
    }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.3;
      color: var(--color-ink);
      background: var(--color-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ------------------------------------------------------------------ */
    /* Header                                                               */
    /* ------------------------------------------------------------------ */
    .site-header {
      height: var(--header-height);
      flex-shrink: 0;
      border-bottom: 2px solid var(--color-rule-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 16px;
    }

    .site-header__title {
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 600;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-header__meta {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-ink-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ------------------------------------------------------------------ */
    /* Content                                                              */
    /* ------------------------------------------------------------------ */
    .site-content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ------------------------------------------------------------------ */
    /* Footer                                                               */
    /* ------------------------------------------------------------------ */
    .site-footer {
      height: var(--footer-height);
      flex-shrink: 0;
      border-top: 1px solid var(--color-rule);
      display: flex;
      align-items: stretch;
    }

    .footer-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
      height: 100%;
      min-width: 44px;
      font-family: var(--font-body);
      font-size: var(--text-xs);
      color: var(--color-ink);
      background: none;
      border: none;
      border-right: 1px solid var(--color-rule);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .footer-btn:hover {
      background: var(--color-bg-alt);
    }

    .footer-btn--disabled,
    .footer-btn[disabled] {
      color: var(--color-ink-faint);
      pointer-events: none;
    }

    .footer-btn svg {
      flex-shrink: 0;
    }

    .footer-hint {
      margin-left: auto;
      padding: 0 16px;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-ink-muted);
      display: flex;
      align-items: center;
    }

    /* ------------------------------------------------------------------ */
    /* Child-template extensions                                            */
    /* ------------------------------------------------------------------ */
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>

<header class="site-header">
  <span class="site-header__title">
    {% block header_title %}{{ view_title }}{% endblock %}
  </span>
  <span class="site-header__meta">{{ current_time }}</span>
</header>

<main class="site-content">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  {% block footer_buttons %}
  <button class="footer-btn" type="button" onclick="history.back()">
    <!-- corner-up-left: Esci -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
      <path d="M18 18v-6a3 3 0 0 0 -3 -3h-10" />
      <polyline points="8 12 5 9 8 6" />
    </svg>
    Esci
  </button>
  <button class="footer-btn" type="button">
    <!-- chevron-up: Su -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
      <polyline points="6 15 12 9 18 15" />
    </svg>
    Su
  </button>
  <button class="footer-btn" type="button">
    <!-- chevron-down: Giù -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
      <polyline points="6 9 12 15 18 9" />
    </svg>
    Giù
  </button>
  <button class="footer-btn" type="button">
    <!-- check: Invio -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
      <path d="M5 12l5 5l10 -10" />
    </svg>
    Invio
  </button>
  {% endblock %}
  <span class="footer-hint">{% block footer_hint %}{% endblock %}</span>
</footer>

</body>
</html>
